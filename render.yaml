services:
  - type: web
    name: shopee-pipeline
    env: python
    region: singapore          # closest to SEA
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false            # paste value manually in Render dashboard
      - key: GOLOGIN_TOKEN
        sync: false
      - key: CONCURRENCY
        value: "5"
      - key: NAV_TIMEOUT_MS
        value: "15000"
